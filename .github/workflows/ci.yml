# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  docs-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate documentation baseline
        run: |
          bash ./scripts/validate-docs.sh
