# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  docs-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate documentation baseline
        run: |
          bash ./scripts/validate-docs.sh
