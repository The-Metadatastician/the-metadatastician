# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  docs-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate documentation baseline
        run: |
          bash ./scripts/validate-docs.sh
