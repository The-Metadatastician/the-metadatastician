# SPDX-License-Identifier: MPL-2.0
name: Changelog Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate changelog update policy
        run: |
          ./scripts/check-changelog.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
