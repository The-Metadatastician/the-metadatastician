# SPDX-License-Identifier: MPL-2.0
name: Changelog Gate

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  changelog-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate changelog update policy
        run: |
          ./scripts/check-changelog.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
